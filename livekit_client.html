<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PipecatX Voice Agent</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid; place-items: center; min-height: 100vh; margin: 0;
      }
      main { text-align: center; max-width: 32rem; padding: 1.5rem; }
      button {
        font: inherit; padding: 0.75rem 1.75rem; border-radius: 0.5rem;
        border: 1px solid currentColor; background: transparent;
        color: inherit; cursor: pointer;
      }
      button[disabled] { opacity: 0.5; cursor: not-allowed; }
      #status { margin-top: 1.25rem; min-height: 1.5rem; }
      #log {
        margin-top: 1rem; text-align: left; font-family: ui-monospace, monospace;
        font-size: 0.8rem; white-space: pre-wrap; opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PipecatX Voice Agent</h1>
      <p>Connect to start a secure voice session.</p>
      <button id="connect">Connect</button>
      <button id="disconnect" hidden>Disconnect</button>
      <p id="status" role="status" aria-live="polite">Idle.</p>
      <div id="log" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
    <script>
      const { Room, RoomEvent, ConnectionState } = LivekitClient;
      const connectBtn = document.getElementById("connect");
      const disconnectBtn = document.getElementById("disconnect");
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const audioEls = new Set();
      let room = null;

      const setStatus = (text) => { statusEl.textContent = text; };
      const log = (text) => {
        logEl.textContent += `${new Date().toLocaleTimeString()}  ${text}\n`;
      };

      async function connect() {
        connectBtn.disabled = true;
        setStatus("Requesting a room...");
        try {
          const response = await fetch("/livekit/connect", { method: "POST" });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.detail || `${response.status} ${response.statusText}`);
          }
          const { url, token, room: roomName } = await response.json();
          log(`room ${roomName}`);

          room = new Room({ adaptiveStream: true, dynacast: true });
          room.on(RoomEvent.TrackSubscribed, (track) => {
            if (track.kind !== "audio") return;
            const element = track.attach();
            element.autoplay = true;
            document.body.appendChild(element);
            audioEls.add(element);
            log("agent audio connected");
          });
          room.on(RoomEvent.ConnectionStateChanged, (state) => {
            log(`connection: ${state}`);
            if (state === ConnectionState.Connected) {
              setStatus("Connected. Start talking.");
              disconnectBtn.hidden = false;
            }
          });
          room.on(RoomEvent.Disconnected, () => {
            setStatus("Disconnected.");
            cleanup();
          });

          setStatus("Connecting to agent...");
          await room.connect(url, token);
          await room.startAudio();
          try {
            await room.localParticipant.setMicrophoneEnabled(true);
            log("microphone published");
          } catch (microphoneError) {
            setStatus("Connected, but no microphone was found.");
            log(`microphone unavailable: ${microphoneError.message}`);
          }
        } catch (error) {
          setStatus(`Failed: ${error.message}`);
          log(`error: ${error.message}`);
          cleanup();
        }
      }

      function cleanup() {
        for (const element of audioEls) element.remove();
        audioEls.clear();
        room = null;
        connectBtn.disabled = false;
        disconnectBtn.hidden = true;
      }

      async function disconnect() {
        setStatus("Disconnecting...");
        if (room) await room.disconnect();
        cleanup();
        setStatus("Idle.");
      }

      connectBtn.addEventListener("click", connect);
      disconnectBtn.addEventListener("click", disconnect);
    </script>
  </body>
</html>
